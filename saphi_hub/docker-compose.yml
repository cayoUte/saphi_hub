services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-acadex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acadex}
      POSTGRES_DB: ${POSTGRES_DB:-acadex}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-acadex}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
